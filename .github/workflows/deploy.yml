name: Deploy to Lambda

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies in Lambda-compatible Docker
        run: |
          rm -rf package deploy.zip
          mkdir package
          docker run --rm -v "$PWD":/build -w /build --entrypoint "" \
            public.ecr.aws/lambda/python:3.12 \
            bash -c "pip install --no-cache-dir -r requirements.txt -t package/"
          cp lambda_function.py package/
          cd package && zip -r "$GITHUB_WORKSPACE/deploy.zip" .
          echo "--- Deploy package contents ---"
          zipinfo "$GITHUB_WORKSPACE/deploy.zip" | head -50

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name stock-price-collector \
            --zip-file fileb://deploy.zip
